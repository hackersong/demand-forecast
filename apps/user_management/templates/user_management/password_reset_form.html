{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-body">
                <h2 class="card-title">{% translate "重置密码" %}</h2>
                <p class="text-muted small">{% translate "填写注册时使用的邮箱，系统会发送一个重置链接。" %}</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary">{% translate "发送重置链接" %}</button>
                    <a href="{% url 'user_management:login' %}" class="btn btn-link">{% translate "返回登录" %}</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
