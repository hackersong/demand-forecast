{% extends "base.html" %}
{% load i18n %}

{% block content %}

    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-body">
                <h2 class="card-title">{% translate "请查收邮件" %}</h2>
                <p>{% translate "如果该邮箱已注册，重置链接已发送，请注意查收（开发环境会打印在终端）。" %}</p>
                <a href="{% url 'user_management:login' %}" class="btn btn-primary">{% translate "返回登录" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
